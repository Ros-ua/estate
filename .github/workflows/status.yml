name: Забрать состояние моделей

# Зачем через облако, а не напрямую со страницы:
# страница пыталась читать состояние с чужого адреса, и браузер это резал
# (ERR_BLOCKED_BY_CLIENT — так поступают блокировщики и строгие настройки).
# Теперь файл лежит на самом сайте, и читать его нечему мешать.
#
# Цепочка целиком:
#   сторож на сервере  →  гист  →  этот сценарий  →  status.json на сайте
# Ключей провайдеров здесь нет и не нужно: гист публично читаем.

on:
  schedule:
    - cron: '0 6 * * *'        # 09:00 по Москве, через час с небольшим после сторожа
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  # ⛔ ИДЕНТИФИКАТОР ЗАДАНИЯ — ТОЛЬКО ЛАТИНИЦЕЙ.
  # Здесь стояло «забрать», и GitHub отвергал файл целиком: с 25.08 по 26.08
  # девять прогонов, ВСЕ провалены с «workflow file issue», а по расписанию
  # он не запускался НИ РАЗУ — недействительный файл в расписание не ставится.
  # Заметили только 26.08 при глобальном статусе: страница состояния работала,
  # потому что читает гист напрямую в браузере, и поломка ничем себя не выдавала.
  # Человеческое название живёт в `name:` выше — там кириллица разрешена.
  fetch-status:
    name: Забрать состояние моделей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Скачать состояние из гиста
        run: |
          curl -sfL --retry 3 --retry-delay 5 \
            "https://gist.githubusercontent.com/Ros-ua/118507dd9b1aadc5a8a2977c08a1c8ec/raw/model_status.json" \
            -o новое.json
          # Пустой или битый файл на сайт не кладём — лучше старое, чем сломанное.
          python3 -c "import json;d=json.load(open('новое.json',encoding='utf-8'));assert d.get('модели'),'нет моделей';print('получено моделей:',len(d['модели']))"
          mv новое.json status.json

      - name: Вложить состояние прямо в страницу
        run: |
          # Страница не должна ходить в сеть за своими же данными: обращения
          # режут и блокировщики, и строгие настройки. Вкладываем внутрь.
          python3 вложить.py

      - name: Положить на сайт, если изменилось
        run: |
          if git diff --quiet -- status.json status.html; then
            echo "состояние не изменилось — коммит не нужен"
            exit 0
          fi
          git config user.name  "сторож моделей"
          git config user.email "noreply@github.com"
          git add status.json status.html
          git commit -m "состояние моделей: $(python3 -c "import json;d=json.load(open('status.json',encoding='utf-8'));print(d['проверено'])")"
          git push
